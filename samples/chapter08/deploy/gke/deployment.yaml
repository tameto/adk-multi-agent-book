# samples/chapter08/deploy/gke/deployment.yaml
# GKE用Kubernetesマニフェスト（8-2-6節の完全版）
# Deployment + Service + HPA（Horizontal Pod Autoscaler）の最小構成
#
# 使い方（my-project は自身のプロジェクトIDに置換すること）:
#   sed "s/my-project/${GOOGLE_CLOUD_PROJECT}/g" deployment.yaml | kubectl apply -f -
#
# 注: adk deployによるGKEデプロイ時のServiceタイプが
#     デフォルトでClusterIP。外部公開にはIngressまたはLoadBalancerを別途設定する
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-agent
  labels:
    app: my-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-agent
  template:
    metadata:
      labels:
        app: my-agent
    spec:
      containers:
        - name: agent
          # コンテナイメージ（my-project は自身のプロジェクトIDに置換）
          image: gcr.io/my-project/my-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              # 自身のプロジェクトIDに置換
              value: "my-project"
            - name: DATABASE_URL
              # DB接続文字列はSecretから取得する（コードやマニフェストに直書きしない）
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: database-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: my-agent-service
spec:
  selector:
    app: my-agent
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-agent
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
