# samples/chapter06/tools-cloudsql.yaml
kind: source
name: my-pg
type: cloud-sql-postgres
project: ${GOOGLE_CLOUD_PROJECT}
region: us-central1
instance: my-instance
database: mydb
user: app-user
password: ${DB_PASSWORD}
